name: Build

# Every push / PR: run the tests and build the app.
# Tags like v1.2.0: also package a disk image and publish it as a GitHub Release.
#
# Signing is optional. With these repository secrets the build is Developer ID signed and
# notarized (opens cleanly on any Mac, lid-close protection works):
#   DEVELOPER_ID_P12           base64 of the exported "Developer ID Application" certificate (.p12)
#   DEVELOPER_ID_P12_PASSWORD  password used when exporting the .p12
#   NOTARY_KEY_P8              base64 of an App Store Connect API key (.p8) with Developer access
#   NOTARY_KEY_ID              that key's ID
#   NOTARY_ISSUER              the issuer ID shown on the App Store Connect keys page
# Without them the build is ad-hoc signed: it runs (via Privacy & Security > Open Anyway), but
# lid-close protection is unavailable.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    env:
      HAS_SIGNING: ${{ secrets.DEVELOPER_ID_P12 != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: |
          XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test

      - name: Import Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          SIGN_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          echo "SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"

      - name: Notarization credentials
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        env:
          KEY: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          echo "$KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
          echo "NOTARY_KEY_ID=${{ secrets.NOTARY_KEY_ID }}" >> "$GITHUB_ENV"
          echo "NOTARY_ISSUER=${{ secrets.NOTARY_ISSUER }}" >> "$GITHUB_ENV"

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Build app
        run: |
          [[ -n "${SIGN_IDENTITY:-}" ]] || export SIGN_IDENTITY=-
          scripts/build-app.sh
          codesign -dv "build/Torie-chan.app" 2>&1 | grep -E "Authority|TeamIdentifier|Signature" || true

      - name: Disk image
        run: scripts/make-dmg.sh

      - name: Gatekeeper check
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        run: spctl --assess --type execute --verbose "build/Torie-chan.app"

      - uses: actions/upload-artifact@v4
        with:
          name: Torie-chan-${{ github.run_number }}
          path: |
            build/Torie-chan-*.dmg
            build/Torie-chan-*.dmg.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$HAS_SIGNING" == "true" && "$HAS_NOTARY" == "true" ]]; then
            NOTE="Signed and notarized. Open the disk image and drag Torie-chan to Applications."
          else
            NOTE="**Unsigned build.** macOS will block it at first: open it once, then go to System Settings > Privacy & Security and click Open Anyway. Lid-close protection needs a signed build."
          fi
          printf '%s\n\nRequires an Apple Silicon Mac running macOS 14 or later.\n' "$NOTE" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" build/Torie-chan-*.dmg build/Torie-chan-*.dmg.sha256 \
            --title "Torie-chan ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
