name: Build

# Every push and pull request: run the tests (with a coverage summary) and build an unsigned app.
# Tags like v1.2.0: build, sign with Developer ID, notarize, and publish a GitHub Release.
#
# Signing secrets live in the "release" environment, which only v* tags can deploy to, so no
# branch or pull request workflow can read them. Environment secrets:
#   DEVELOPER_ID_P12           base64 of the exported "Developer ID Application" certificate (.p12)
#   DEVELOPER_ID_P12_PASSWORD  password used when exporting the .p12
#   NOTARY_KEY_P8              base64 of an App Store Connect API key (.p8) with Developer access
#   NOTARY_KEY_ID              that key's ID
#   NOTARY_ISSUER              the issuer ID shown on the App Store Connect keys page
# Without them a tagged build still publishes, ad-hoc signed and labeled unsigned.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test & build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the newest Xcode on the runner
        run: |
          XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test --enable-code-coverage

      - name: Coverage summary
        if: always()
        run: python3 scripts/coverage-summary.py "$(swift test --show-codecov-path)" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Build app (unsigned)
        run: SIGN_IDENTITY=- scripts/build-app.sh

  release:
    name: Sign, notarize & release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-15
    environment: release
    permissions:
      contents: write # publish the GitHub Release
    env:
      HAS_SIGNING: ${{ secrets.DEVELOPER_ID_P12 != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Only release commits that are on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::This tag points at a commit that isn't on main. Release from reviewed code only."
            exit 1
          fi

      - name: Use the newest Xcode on the runner
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Import Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -T /usr/bin/codesign -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          SIGN_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          echo "SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"

      - name: Notarization credentials
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        env:
          KEY: ${{ secrets.NOTARY_KEY_P8 }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          echo "$KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          {
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8"
            echo "NOTARY_KEY_ID=$KEY_ID"
            echo "NOTARY_ISSUER=$ISSUER"
          } >> "$GITHUB_ENV"

      - name: Version
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Build app
        run: |
          [[ -n "${SIGN_IDENTITY:-}" ]] || export SIGN_IDENTITY=-
          scripts/build-app.sh

      - name: Disk image
        run: scripts/make-dmg.sh

      - name: Gatekeeper check
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        run: spctl --assess --type execute --verbose "build/Torie-chan.app"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Torie-chan-${{ github.ref_name }}
          path: |
            build/Torie-chan-*.dmg
            build/Torie-chan-*.dmg.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$HAS_SIGNING" == "true" && "$HAS_NOTARY" == "true" ]]; then
            NOTE="Signed and notarized. Open the disk image and drag Torie-chan to Applications."
          else
            NOTE="**Unsigned build.** macOS will block it at first: open it once, then go to System Settings > Privacy & Security and click Open Anyway. Lid-close protection needs a signed build."
          fi
          printf '%s\n\nRequires an Apple Silicon Mac running macOS 14 or later.\n' "$NOTE" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" build/Torie-chan-*.dmg build/Torie-chan-*.dmg.sha256 \
            --title "Torie-chan ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
