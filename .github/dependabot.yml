version: 2
updates:
  # Keeps the commit-pinned actions in .github/workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  # Keeps Sparkle current. When this bumps it, also update SPARKLE_VERSION and SPARKLE_SHA256 in
  # .github/workflows/build.yml, which fetch the matching release tools.
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
